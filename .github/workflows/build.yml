name: build
on: [push, workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: projeto
        run: |
          echo '' | base64 -d > p.zip
          unzip -q -o p.zip
      - name: sdk
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if ! command -v sdkmanager > /dev/null; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cl.zip
            unzip -q /tmp/cl.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - name: build
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: ffmenu-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
